http_listen_addr: ":6060"
introspection_addr: ":8089"
log_level: info
indexer:
  connstring: host=localhost port=5432 user=clair dbname=clair password=clair sslmode=disable
  scanlock_retry: 10
  layer_scan_concurrency: 5
  migrations: true
matcher:
  connstring: host=localhost port=5432 user=clair dbname=clair password=clair sslmode=disable
  max_conn_pool: 100
  migrations: true
updaters:
  sets:
    - alpine
