name: Secure CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan source with Trivy
        run: |
          docker run --rm \
            -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY \
            -v "$PWD":/src \
            aquasec/trivy:latest fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            /src

      - name: Build Docker image
        run: |
          DOCKERFILE=$(find . -type f -name Dockerfile -path "*/app/*" | head -1)
          echo "Using $DOCKERFILE"
          docker build -t secure-app:latest -f "$DOCKERFILE" "$(dirname "$DOCKERFILE")"

      - name: Scan Docker image
        run: |
          docker run --rm \
            -e TRIVY_DB_REPOSITORY -e TRIVY_JAVA_DB_REPOSITORY \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            secure-app:latest

