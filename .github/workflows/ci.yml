
name: Secure CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Scanner le code source
      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: json
          output: trivy-source.json

      # 4. Construire l'image Docker
      - name: Build Docker image
        if: always()
        run: |
          docker build -t secure-app:latest -f app/Dockerfile app/

      # 5. Scanner l'image
      - name: Scan Docker image
        if: success()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secure-app:latest
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: json
          output: trivy-image.json

      # 6. Enregistrer les rapports
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-source.json
            trivy-image.json
          if-no-files-found: ignore

      # 7. Se connecter a GHCR
      - name: Login to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Publier l'image
      - name: Push image to GHCR
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/secure-app:latest
          docker tag secure-app:latest $IMAGE
          docker push $IMAGE
