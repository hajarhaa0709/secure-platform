name: Secure CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repository layout
        run: ls -R | head -50

      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table

      - name: Build Docker image
        run: |
          DOCKERFILE=$(find . -type f -name Dockerfile -path "*/app/*" | head -1)
          echo "Using $DOCKERFILE"
          docker build -t secure-app:latest -f "$DOCKERFILE" "$(dirname "$DOCKERFILE")"

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secure-app:latest
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table
